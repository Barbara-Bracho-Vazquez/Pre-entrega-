  <body>
    <header class="header-nav " >

    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text secondary">CONTACTANOS</h1>
    
      <form class="form-contacto" action="" method="post" target="_blank" ">
        <div class="grupo-input">
          <label for="nombre">Nombre:</label>
          <input type="text" placeholder="Ingrese su nombre..." />
        </div>
        <div class="grupo-input">
          <label for="correo">Correo Electronico:</label>
          <input type="email" placeholder="Ingrese su Correo..." />
        </div>
        <div class="grupo-input">
          <label for="Mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" placeholder="Ingrese su Mensaje..." ></textarea>
        </div>

        <button class="btn bg-secondary" type="submit">Enviar</button>
        <button class="btn bg-secondary" type="reset">Limpiar</button>
      </form>
      </section>
    </main>
    <section>
       <footer>
        <P>Sitio de Barbara Bracho</P>

          <ul class="redes-footer">

          <img src="../imagenes/whatsapp.png" alt="logo whatsapp">
          <img src="../imagenes/instagram.png" alt="logo instagram">
        </li>
          </ul>
      </nav>
      </footer>
    </section>
  </body>
